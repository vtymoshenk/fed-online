<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Catamaran:wght@100..900&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Best Developers <span>On The Planet</span></h1>
        <p class="text-head">This Product integrates with your favorite apps to automate workflows and ensure smooth,
            productive work
            days.</p>
        <div class="cont-cards">
            <div class="card">
                <img class="img-avatar" src="img10/Avatar1.png" alt="avatar1">
                <h3 class="name">Dan Burykin</h3>
                <p class="it-langue">Vue.JS Developer</p>
                <div class="it-icons">
                    <img class="img-icons" src="img10/VueJs.png" alt="VueJs">
                </div>
            </div>
            <div class="card">
                <img class="img-avatar" src="img10/Avatar2.png" alt="Avatar2">
                <h3 class="name">Esi Doda</h3>
                <p class="it-langue">Software Developer</p>
                <div class="it-icons">
                    <img class="img-icons" src="img10/Angular.png" alt="Angular">
                    <img class="img-icons" src="img10/Flutter.png" alt="Flutter">
                    <img class="img-icons" src="img10/ReactJS.png" alt="ReactJS">
                </div>
            </div>
            <div class="card">
                <img class="img-avatar" src="img10/Avatar3.png" alt="Avatar3">
                <h3 class="name">Alex Harper</h3>
                <p class="it-langue">RN Executive</p>
                <div class="it-icons">
                    <img class="img-icons" src="img10/JAVA.png" alt="JAVA">
                    <img class="img-icons" src="img10/React Native.png" alt="RN">
                </div>
            </div>
            <div class="card">
                <img class="img-avatar" src="img10/Avatar4.png" alt="Avatar4">
                <h3 class="name">Amarna Miller</h3>
                <p class="it-langue">Frontend Wizard</p>
                <div class="it-icons">
                    <img class="img-icons" src="img10/HTML.png" alt="HTML">
                    <img class="img-icons" src="img10/CSS.png" alt="CSS">
                </div>
            </div>
        </div>
    </div>

</body>

</html>
